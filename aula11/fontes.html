<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Fontes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans&family=Nunito&family=Playfair+Display&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: "Bebas Neue";
            src: url("fontes/BebasNeue-Regular.ttf");
        }

        @font-face {
            font-family: "Caveat";
            src: url("fontes/Caveat-Variable.ttf");
        }

        @font-face {
            font-family: "Chakra Petch";
            src: url("fontes/ChakraPetch-Regular.ttf");
        }

        body {
            background-color: #F1EBCB;
            color: #436A6F;
            margin: 0;
            padding: 30px 20px;
            text-align: center;
        }

        .parte-1, .parte-2 {
            background-color: white;
            border: 3px solid #61888C;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .fonte-dm-sans {
            font-family: "DM Sans", sans-serif;
        }

        .fonte-nunito {
            font-family: "Nunito", sans-serif;
        }

        .fonte-playfair {
            font-family: "Playfair Display", serif;
        }

        .fonte-bebas {
            font-family: "Bebas Neue", sans-serif;
        }

        .fonte-caveat {
            font-family: "Caveat", cursive;
        }

        .fonte-chakra {
            font-family: "Chakra Petch", sans-serif;
        }
    </style>
</head>
<body>
    <section class="parte-1">
        <h1>Parte 1 - Google Fonts</h1>
        <p class="fonte-dm-sans">DM Sans: exemplo de fonte.</p>
        <p class="fonte-nunito">Nunito: exemplo de fonte.</p>
        <p class="fonte-playfair">Playfair Display: exemplo de fonte.</p>
    </section>

    <section class="parte-2">
        <h1>Parte 2 - Fontes baixadas</h1>
        <p class="fonte-bebas">Bebas Neue: exemplo de fonte.</p>
        <p class="fonte-caveat">Caveat: exemplo de fonte.</p>
        <p class="fonte-chakra">Chakra Petch: exemplo de fonte.</p>
    </section>

    <p><a href="index.html">Voltar para a página dos divs</a></p>
</body>
</html>
