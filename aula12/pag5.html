<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página 5</title>
    <style>
/* 
ELEMENTOS SITE-WIDE
*/
body{
    background-image: radial-gradient(rgb(124, 151, 187) 1px, transparent 1px);
    background-size: 24px 24px;
    background-color: rgb(188, 201, 214); 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
header{
    background-color: rgb(219, 226, 233);
    width: all; height: 10vh;
    border-radius: 15px;
    display: flex;
    align-content: center;
    padding: 2px 10px;
    box-shadow: 0px 2px 6px rgb(128, 123, 167);
}
nav{
    display: flex;
    padding: 5px 5px;
    align-self: center;
}
a{
    height: 50px; width: 50px;
    background-color: rgb(128, 123, 167);
    border-radius: 10px;
}
img{
    width: 40px; height: 40px;
    padding: 5px;
}
/* -------------------*/


.ch{
    padding-top: 30px;
    font: tahoma;
    color: rgb(74, 91, 128); text-shadow: 2px 2px 5px rgb(65, 53, 110);
    text-align: center;
    font-size: 30px;
}
.card{
    background-color: rgb(219, 226, 233);
    border-radius: 15px;
    box-shadow: 3px 3px 5px rgb(128, 123, 167);
    margin: -20px 10px;
    padding: 8px 10px;
    display: flex;
    max-width: 1000px;
    margin-inline: auto;
}
.box{
    background-color: rgb(128, 123, 167);
    border-radius: 10px;
    height: 50px; width: 50px;
    margin: 5px 5px;
}

    </style>
</head>
<body>

<header>
    <nav>
        <a href="./index.html" target="_self"><img src="./img/home.webp" alt="Ícone de Home"></a>
    </nav>
</header>

<h1 class="ch">flex-start</h1>
<div class="card" style="justify-content: flex-start;">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
</div>

<h1 class="ch">flex-end</h1>
<div class="card" style="justify-content: flex-end;">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
</div>

<h1 class="ch">center</h1>
<div class="card" style="justify-content: center;">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
</div>

<h1 class="ch">space-between</h1>
<div class="card" style="justify-content: space-between;">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
</div>

<h1 class="ch">space-around</h1>
<div class="card" style="justify-content: space-around;">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
</div>

<p style="padding: 100px;"> </p>

</body>
</html>
