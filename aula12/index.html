    <title>Aula 12 · 20/10 · flexbox</title>
    <style>

body{
    background-image: radial-gradient(rgb(124, 151, 187) 1px, transparent 1px);
    background-size: 24px 24px;
    background-color: rgb(188, 201, 214); 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

header{
    background-color: rgb(219, 226, 233);
    width: all; height: 10vh;
    border-radius: 15px;
    display: flex;
    align-content: center;
    padding: 2px 10px;
    box-shadow: 0px 2px 6px rgb(128, 123, 167);
}
nav{
    display: flex;
    padding: 5px 5px;
    align-self: center;
}
.nav{
    height: 50px; width: 50px;
    background-color: rgb(128, 123, 167);
    border-radius: 10px;
}

h1{
    color: rgb(128, 123, 167); 
    text-align: center; margin: auto;
}

p{
    font: tahoma;
    color: rgb(222, 227, 239); text-shadow: 2px 2px 5px rgb(141, 131, 177);
    text-align: center; text-decoration: underline; text-wrap-mode: wrap; padding-top: 10px;
}
.card1{
    background-color: rgb(219, 226, 233);
    border-radius: 15px;
    box-shadow: 3px 3px 5px rgb(128, 123, 167);
    margin: 30px 10px;
    padding: 8px 10px;
    display: flex;
    max-width: 1000px;
    margin-inline: auto;
}

a{
    background-color: rgb(128, 123, 167);
    box-shadow: 3px 3px 10px rgb(141, 131, 177);
    display: flex;
    flex-direction: column;
    width: 20vh; height: 30vh;
    margin: 15px 15px;
    border-radius: 10px;
    justify-content: center;
}

    </style>
