<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página 15</title>
    <style>
body{
    background-image: radial-gradient(rgb(124, 151, 187) 1px, transparent 1px);
    background-size: 24px 24px;
    background-color: rgb(188, 201, 214);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
header{
    background-color: rgb(219, 226, 233);
    border-radius: 15px;
    box-shadow: 0px 2px 6px rgb(128, 123, 167);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    margin: 20px auto;
    max-width: 1000px;
}
.logo{
    background-color: rgb(128, 123, 167);
    border-radius: 10px;
    width: 50px; height: 50px;
}
nav{
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}
nav a{
    background-color: rgb(128, 123, 167);
    color: rgb(222, 227, 239);
    padding: 8px 12px;
    border-radius: 10px;
    text-decoration: none;
}
.cards{
    display: flex;
    flex-wrap: wrap;
    justify-content: space-around;
    gap: 20px;
    max-width: 1000px;
    margin: 30px auto;
    padding: 0 10px;
}
.card{
    background-color: rgb(219, 226, 233);
    border-radius: 15px;
    box-shadow: 3px 3px 5px rgb(128, 123, 167);
    width: 260px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}
.card p{
    flex-grow: 1;
}
.card button{
    background-color: rgb(128, 123, 167);
    color: rgb(222, 227, 239);
    border: none;
    border-radius: 10px;
    padding: 8px 16px;
    cursor: pointer;
}
.card button:hover{
    background-color: rgb(141, 131, 177);
    box-shadow: 2px 2px 8px rgb(128, 123, 167);
}
@media (max-width: 700px){
    header{
        flex-direction: column;
    }
    .card{
        width: 90%;
    }
}
    </style>
</head>
<body>

<header>
    <div class="logo"></div>
    <nav>
        <a href="#">Início</a>
        <a href="#">Sobre</a>
        <a href="#">Contato</a>
    </nav>
</header>

<div class="cards">
    <div class="card">
        <h2>Card 1</h2>
        <p>Texto do primeiro card</p>
        <button>Botão</button>
    </div>
    <div class="card">
        <h2>Card 2</h2>
        <p>Texto do segundo card</p>
        <button>Botão</button>
    </div>
    <div class="card">
        <h2>Card 3</h2>
        <p>Texto do terceiro card</p>
        <button>Botão</button>
    </div>
</div>

</body>
</html>
